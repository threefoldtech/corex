name: Build release
on:
  push:
    branches:
      - "*"
#on:
#  release:
#    types: [created]
jobs:
  static:
    name: Create release artifact (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@master

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl musl-tools curl wget cmake xxd

      - name: Download static dependencies
        run: |
          mkdir staging
          cd staging

          wget https://www.zlib.net/zlib-1.2.12.tar.xz
          wget https://git.kernel.org/pub/scm/linux/kernel/git/morgan/libcap.git/snapshot/libcap-2.33.tar.gz
          wget https://github.com/json-c/json-c/archive/json-c-0.13.1-20180305.tar.gz
          wget https://www.openssl.org/source/openssl-1.1.1d.tar.gz
          wget https://github.com/warmcat/libwebsockets/archive/v3.2.0.tar.gz -O libwebsockets-3.2.0.tar.gz
          
          md5sum -c ../.github/workflows/checksum
 
      - name: Build production 0-db-fs
        run: |
          make production
          version=$(grep ZDBFS_VERSION src/zdbfs.h | awk '{ print $3 }' | sed s/'"'//g)
          cp zdbfs zdbfs-${version}-amd64-linux-static

      - name: Upload the artifacts
        uses: skx/github-action-publish-binaries@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: 'corex-*-linux-static'

